worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 1. Rate Limiting Configuration (Anti-DoS)
    # Zone 'mylimit': Limits to 10 requests/second per IP for general APIs.
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    
    # Zone 'adminlimit': Stricter limit (2 requests/second) for sensitive admin operations.
    limit_req_zone $binary_remote_addr zone=adminlimit:10m rate=2r/s;

    server {
        listen 80;
        server_name localhost;

        # Get real IP from Cloudflare Tunnel
        set_real_ip_from 127.0.0.1;
        real_ip_header CF-Connecting-IP;
        real_ip_recursive on;

        # Basic Reverse Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------------------------------------------
        # Admin UI (React Frontend) - IP Whitelisted
        # -----------------------------------------------------------------
        location /admin {
            allow 127.0.0.1;          # Allow localhost
            allow 192.168.1.0/24;     # Allow local network range
            allow 171.250.164.189;          # Add your specific Admin IP here
            deny all;
            
            proxy_pass http://localhost:3000;
        }

        # -----------------------------------------------------------------
        # Public Frontend (React UI)
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://localhost:3000;
        }

        # -----------------------------------------------------------------
        # Admin APIs - IP Whitelisted & Rate Limited
        # -----------------------------------------------------------------
        location /api/admin/ {
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;

            limit_req zone=adminlimit burst=5 nodelay;
            proxy_pass http://localhost:8081/admin/;
        }

        # -----------------------------------------------------------------
        # Standard APIs - Rate Limited
        # -----------------------------------------------------------------
        location /api/ {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://localhost:8081/; 
        }

        # -----------------------------------------------------------------
        # Websocket (Chinese Chess Game)
        # -----------------------------------------------------------------
        location /ws {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
